# Запустить в терминале docker-compose up -d
# Остановить контейнеры docker-compose stop demo9compose
# Остановить и удалить контейнеры docker-compose down
services:   
  demo9-restful:
    image: demo9restful:latest    
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}  
    volumes:
      - demo9db-data:/opt/h2-data
  demo7-reactshop:
    image: demo7reactshop:latest 
    environment:
      - API_KEY=${REACTSHOP_API_KEY}
      - API_URL=${REACTSHOP_API_URL}
    ports:
      - "80:3000"
    depends_on:
      - demo9-restful 
volumes:
  demo9db-data:     